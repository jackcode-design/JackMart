#!/usr/bin/env bash
set -euo pipefail

HEALTH_URL="${1:?Usage: smoke-test.sh https://host/jackmart/api/v1/health}"

echo "Checking $HEALTH_URL"
BODY="$(curl -fsSL --max-time 15 "$HEALTH_URL")"

echo "$BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' || {
  echo "Application health is not UP"
  exit 1
}

echo "$BODY" | grep -q '"db"[[:space:]]*:[[:space:]]*"UP"' || {
  echo "Database health is not UP"
  exit 1
}

echo "Smoke test passed: application and database are UP."
